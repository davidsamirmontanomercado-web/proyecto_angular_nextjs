
<app-navbar></app-navbar>

<main class="container page-top" style="padding-bottom:60px;max-width:820px">
  <div class="section-head">
    <span class="tag">Nueva transmisión</span>
    <h2 class="section-title">Hacer un en vivo</h2>
    <p class="section-sub">Configura los detalles de tu transmisión.</p>
  </div>

  <form class="panel" (ngSubmit)="onSubmit($event)">
    <div class="field">
      <label class="field-label">Línea de negocio <span class="req">*</span></label>
      <select class="field-select">
        <option>Ventas — Productos nuevos</option>
        <option>Producción — Fábrica / Proceso</option>
        <option>Usados — Productos usados</option>
      </select>
    </div>

    <div class="field">
      <label class="field-label">Título del LIVE <span class="req">*</span></label>
      <input type="text" class="field-input" placeholder="Ej: Lanzamiento colección muebles 2025" required>
    </div>

    <div class="field">
      <label class="field-label">Descripción <span class="req">*</span></label>
      <textarea class="field-textarea" placeholder="Describe de qué tratará tu transmisión..." required></textarea>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="field">
        <label class="field-label">Categoría <span class="req">*</span></label>
        <select class="field-select">
          <option>Seleccionar categoría</option>
          <option>Muebles y oficina</option>
          <option>Maquinaria industrial</option>
          <option>Tecnología</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Subcategoría</label>
        <select class="field-select">
          <option>Seleccionar subcategoría</option>
          <option>Escritorios</option>
          <option>Sillas</option>
          <option>Archivadores</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Imagen de portada</label>
      <div style="border:2px dashed var(--border);border-radius:var(--r-sm);padding:28px;text-align:center;background:var(--bg-soft);cursor:pointer">
        <div style="font-size:24px;margin-bottom:6px">🖼️</div>
        <div style="font-size:13px;color:var(--text-soft)">Haz clic para subir una imagen</div>
      </div>
    </div>

    <div class="field">
      <label class="field-label">Ubicación desde donde transmitirás</label>
      <select class="field-select">
        <option>Barranquilla, Atlántico</option>
        <option>Bogotá D.C.</option>
        <option>Medellín, Antioquia</option>
      </select>
    </div>

    <div class="field">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:14px;padding:14px 16px;background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--r-sm)">
        <div>
          <div style="font-size:13px;font-weight:600">Permitir preguntas durante el LIVE</div>
          <div style="font-size:12px;color:var(--text-soft)">Los espectadores podrán enviar preguntas en tiempo real</div>
        </div>
        <label class="switch"><input type="checkbox" checked><span class="switch-track"></span></label>
      </div>
    </div>

    <div style="display:flex;justify-content:space-between;gap:10px;margin-top:24px;padding-top:20px;border-top:1px solid var(--border-soft)">
      <a routerLink="/dashboard" class="btn btn-ghost">← Atrás</a>
      <button type="submit" class="btn btn-live">🔴 Salir al aire</button>
    </div>
  </form>
</main>

<app-footer></app-footer>

<app-navbar></app-navbar>

<main class="container page-top" style="padding-bottom:60px">
  <div class="section-head">
    <span class="tag">En Vivos</span>
    <h2 class="section-title">Transmisiones segmentadas</h2>
    <p class="section-sub">Cada en vivo aparece según el contenido que consumes.</p>
  </div>

  <div class="tabs" style="display:flex;justify-content:center;margin:0 auto 40px">
    @for (f of filtros; track f) {
      <button class="tab" [class.active]="filtro === f" (click)="filtro = f">{{ f }}</button>
    }
  </div>

  <div class="grid-3">
    @for (l of lives; track l.titulo) {
      <a routerLink="/live" class="live-card">
        <div class="live-thumb">
          <div class="live-badge">EN VIVO</div>
          <div class="live-viewers">👁 {{ l.viewers }}</div>
        </div>
        <div class="live-body">
          <div class="live-cat">{{ l.cat }}</div>
          <div class="live-title">{{ l.titulo }}</div>
          <div class="live-desc">{{ l.desc }}</div>
          <div class="live-tags">
            @for (t of l.tags; track t) { <span class="tag-chip">{{ t }}</span> }
          </div>
        </div>
      </a>
    }
  </div>
</main>

<app-footer></app-footer>
